<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearclip banner</title>
<!-- The README banner (docs/readme/banner-<lang>-<light|dark>.png): node tools/banner.mjs. The live demo frozen mid-copy. -->
<link rel="stylesheet" href="../public/assets/css/site.css">
<style>
  /* The banner keeps its own look (the PNGs in docs/readme): the old page colours, and the demo as a 2 × 2 grid. */
  :root { --bg: #F5F5F7; --line: rgba(0,0,0,0.09); --accent-ink: #3E4BE6; --surface: #FFFFFF; --ink: #1D1D1F; --ink-2: #48484D; --muted: #6E6E73; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1012; --line: rgba(255,255,255,0.09); --accent-ink: #8B96FF; --surface: #1A1B1E; --ink: #F5F5F7; --ink-2: #D1D1D6; --muted: #98989D; }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", sans-serif; }
  .demo { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .tile { height: 262px; }
  .t-row:nth-child(n+4) { display: none; }
  html, body { background: transparent; margin: 0; }
  body { width: 1600px; height: 600px; overflow: hidden; }
  .card { position: absolute; inset: 0; border-radius: 40px; background: var(--bg); border: 1px solid var(--line); display: grid; grid-template-columns: 1fr 600px; gap: 56px; align-items: center; padding: 0 64px 0 96px; overflow: hidden; }
  .id { display: flex; align-items: center; gap: 30px; }
  .id img { width: 164px; height: 164px; margin: -10px; }
  .id h1 { margin: 0; font-size: 112px; line-height: 1; letter-spacing: -0.045em; font-weight: 760; }
  .id p { margin: 12px 0 0 4px; font-size: 26px; color: var(--muted); }
  .id p b { color: var(--ink); letter-spacing: 0.08em; }
  .tag { margin: 46px 0 0; font-size: 46px; line-height: 1.18; letter-spacing: -0.025em; font-weight: 700; }
  html:lang(ko) .tag { letter-spacing: -0.02em; font-size: 44px; }
  .tag span { color: var(--accent-ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .chips span { font-size: 21px; padding: 7px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-weight: 500; }
  .demo-box { max-width: 600px; }
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="id">
      <img src="../public/assets/media/icon-512.png" alt="">
      <div><h1>Nearclip</h1><p>by <b>ivLis STUDIO</b></p></div>
    </div>
    <p class="tag" id="tag"></p>
    <div class="chips" id="chips"></div>
  </div>
  <div class="demo-box"><div id="demo"></div></div>
</div>
<script src="../public/assets/js/icons.js"></script>
<script src="../public/assets/js/i18n.js"></script>
<script src="../public/assets/js/demo.js"></script>
<script>
  var lang = new URLSearchParams(location.search).get("lang") === "ko" ? "ko" : "en";
  document.documentElement.lang = lang;
  var W = {
    en: { tag: "Copy here.<br><span>Paste there.</span>", chips: ["Free &amp; open source", "No account · no server", "End-to-end encrypted", "Mac · Windows · Android · iPhone"] },
    ko: { tag: "여기서 복사하고,<br><span>저기서 붙여넣기.</span>", chips: ["무료·오픈 소스", "계정·서버 없음", "종단 간 암호화", "Mac·Windows·Android·iPhone"] },
  }[lang];
  document.getElementById("tag").innerHTML = W.tag;
  document.getElementById("chips").innerHTML = W.chips.map(function (c) { return "<span>" + c + "</span>"; }).join("");
  window.NearclipDemo.mount(document.getElementById("demo"), {
    strings: window.DEMO[lang],
    still: { before: [["android", 1, 3], ["ios", 2, 2]], from: "mac", s: 0, t: 0.5, arrived: ["win", "ios"] },
  });
</script>
</body>
</html>
