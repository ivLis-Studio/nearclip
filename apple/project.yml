name: Nearclip
options:
  bundleIdPrefix: studio.ivlis
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  NearclipKit:
    path: NearclipKit
targetTemplates:
  # The Mac app. Two targets share it: Nearclip (Developer ID, GitHub releases) and NearclipAppStore (sandboxed,
  # Mac App Store). The App Store build compiles with APPSTORE, which leaves out "Paste after choosing" (sending ⌘V
  # to another app needs Accessibility, which a sandboxed app is not given).
  MacApp:
    type: application
    platform: macOS
    sources:
      - path: macOS
      - path: Shared
      - path: ../tailnet/notices/THIRD_PARTY_NOTICES.txt
        group: Shared
        buildPhase: resources
    dependencies:
      - package: NearclipKit
        product: NearclipKit
    info:
      path: macOS/Info.plist
      properties:
        CFBundleName: Nearclip
        CFBundleDisplayName: Nearclip
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 ivLis Studio · MIT License"
        NSLocalNetworkUsageDescription: Nearclip finds and connects to your other devices on this network.
        NSBonjourServices: [_nearclip._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: studio.ivlis.nearclip.pair
            CFBundleURLSchemes: [nearclip]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.ivlis.nearclip
        PRODUCT_NAME: Nearclip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
targets:
  Nearclip:
    templates: [MacApp]
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
  NearclipAppStore:
    templates: [MacApp]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AppStore/Nearclip.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APPSTORE
  NearclipShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: iOS/PrivacyInfo.xcprivacy
    dependencies:
      - package: NearclipKit
        product: NearclipKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.ivlis.nearclip.share
        CODE_SIGN_ENTITLEMENTS: iOS/Nearclip.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Nearclip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Nearclip sends shared text, links and images directly to your devices.
        NSBonjourServices: [_nearclip._tcp]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
  NearclipiOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: ../tailnet/notices/THIRD_PARTY_NOTICES.txt
        group: Shared
        buildPhase: resources
    dependencies:
      - target: NearclipShare
        embed: true
      - package: NearclipKit
        product: NearclipKit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleName: Nearclip
        CFBundleDisplayName: Nearclip
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Nearclip finds and connects to your other devices on this Wi-Fi.
        NSBonjourServices: [_nearclip._tcp]
        NSCameraUsageDescription: Nearclip uses the camera to scan the pairing code shown on your other device.
        CFBundleURLTypes:
          - CFBundleURLName: studio.ivlis.nearclip.pair
            CFBundleURLSchemes: [nearclip]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.ivlis.nearclip
        PRODUCT_NAME: Nearclip
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: iOS/Nearclip.entitlements
  NearclipiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOSUITests
    dependencies:
      - target: NearclipiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.ivlis.nearclip.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NearclipiOS
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Nearclip:
    build:
      targets:
        Nearclip: all
    run:
      config: Debug
  NearclipAppStore:
    build:
      targets:
        NearclipAppStore: all
    run:
      config: Debug
  NearclipiOS:
    build:
      targets:
        NearclipiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NearclipiOSUITests

