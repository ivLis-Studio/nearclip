name: Website

on:
  push:
    branches: [main]
    paths: ["website/public/**", ".github/workflows/website.yml", "tools/release/altstore_source.py"]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Refresh sideload source from the latest released IPA
        run: python3 tools/release/altstore_source.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/public
      - id: deployment
        uses: actions/deploy-pages@v5

